<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phone; content column of cards & panels */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F4F4F4; --line:#EBEBEB;
  --ink:#3B3B3B; --muted:#7A7A7A; --brand:#E5132E; --brand-ink:#FFFFFF;

  --fs:15px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1E1E1E; --sunk:#2A2A2A; --line:#333333;
  --ink:#F2F2F2; --muted:#A8A8A8; --brand:#FF3B50; --brand-ink:#FFFFFF;
  --accent:#FFC233; --accent-soft:#3D2C08; --brand-soft:#42171C;
  --ok:#4CC98A; --ok-soft:#15301F; --warn:#FFC233; --crit:#FF3B50; --crit-soft:#42171C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1E1E; --sunk:#2A2A2A; --line:#333333;
  --ink:#F2F2F2; --muted:#A8A8A8; --brand:#FF3B50; --brand-ink:#FFFFFF;
  --accent:#FFC233; --accent-soft:#3D2C08; --brand-soft:#42171C;
  --ok:#4CC98A; --ok-soft:#15301F; --warn:#FFC233; --crit:#FF3B50; --crit-soft:#42171C; color-scheme:dark}
html.big{--fs:17px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}

.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.rail .spacer{flex:1}
.mini{font-size:12px;color:var(--muted);padding:8px 12px}
/* main */
main{min-width:0;padding-block:20px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.iconbtn{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:var(--accent);color:#2A1A04}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}

.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--accent-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-neutral{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)}
.label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}

.num{font-variant-numeric:tabular-nums}
/* mural */
.muralgrid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.feed{display:flex;flex-direction:column;gap:14px;min-width:0}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.post.urgent{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.phead{display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none}
.phead .who{min-width:0;flex:1}

.phead .who span{font-size:13px;color:var(--muted)}
.post p{margin:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.act{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.act:hover{background:var(--sunk);color:var(--ink)}
.act.on{color:var(--crit)}
.act svg{width:16px;height:16px}
.composer textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;min-height:70px}
.composer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
.side h3{font-size:16px;margin-bottom:10px}
.need{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.impact{background:var(--brand);color:#fff;border:0}
/* delivery-app look */
h1,h2,h3,.logo b,.mobilelogo{font-weight:900}
.head h1{font-weight:900;letter-spacing:-.01em}
.rail{background:var(--surface)}
.nav[aria-current="page"]{background:none;color:var(--brand)}
.chip{border-color:var(--line);color:var(--ink);font-weight:700}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.search{background:var(--sunk);border-color:transparent;border-radius:10px;padding:11px 14px}
.search svg{color:var(--brand)}
.btn{border-radius:8px;font-family:var(--display);font-weight:800}
.btn.accent{background:var(--brand);color:#fff}
.btn.ghost{color:var(--brand);border-color:var(--line)}
.panel,.post,.ong,.stat,.match,.qitem{border-color:var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}

.avatar{border-radius:50%}
.addr{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:0;background:none;padding:0}

.addr svg{color:var(--brand)}
.rowscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}

.circ{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12.5px;font-weight:700;text-align:center;scroll-snap-align:start}
.circ span.c{width:68px;height:68px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;transition:transform .15s}

.banner{flex:none;width:min(380px,82%);aspect-ratio:2.2/1;border-radius:14px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:0;text-align:left;scroll-snap-align:start;position:relative;overflow:hidden}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.star{color:var(--accent);font-weight:800}

.steps{display:flex;gap:6px;flex-wrap:wrap}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.cat b{font-size:15px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13.5px}
.match{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.score{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:conic-gradient(var(--brand) calc(var(--v)*1%),var(--sunk) 0)}
.score span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.why{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
/* ongs */
.ongs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ong{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}

.insp{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}

.tabbar{display:none}

.cn{display:flex;justify-content:space-between;gap:8px;font-size:14px}

.cn span{font-size:11.5px;flex:none}
.cl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}

.msg.me{align-self:flex-end;align-items:flex-end}

.cform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cform .inp{flex:1}
.cform .btn svg{width:18px;height:18px}
.backm{display:none}
.btn svg{width:18px;height:18px;flex:none}
.loja .mt2{gap:2px 12px}

.step{min-width:0}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC={
 mural:'<path d="M4 5h16v14H4zM4 10h16M10 10v9"/>',
 doar:'<path d="M12 21s-8-4.6-8-10.3A4.6 4.6 0 0 1 12 8a4.6 4.6 0 0 1 8 2.7C20 16.4 12 21 12 21Z"/>',
 ongs:'<path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/>',
 inspecao:'<path d="M9 12l2 2 4-4"/><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 impacto:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 conta:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 equipe:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M17 5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',
 minhaong:'<path d="M3 21V9l9-6 9 6v12H3zM9 21v-5h6v5M10.5 10.5h3M12 9v3"/>',
 send:'<path d="M4 12 20 4l-6 16-3-7z"/>',
 heart:'<path d="M12 20s-7-4.2-7-9.4A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.6C19 15.8 12 20 12 20Z"/>',
 share:'<path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/>',
 gift:'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9S10 4 7.5 5 9 9 12 9Zm0 0s2-5 4.5-4S15 9 12 9Z"/>',
 food:'<path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M16 3c-2 2-2 7 0 9v9"/>',
 shirt:'<path d="M8 3 3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0Z"/>',
 cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
 hands:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
 book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-5a3 3 0 0 0-3 3"/>',
 pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="m9 8 6 8"/>',
 sofa:'<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M2 11h20v6H2zM5 17v3M19 17v3"/>'
};
const svg=(k,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

const ALLV={mural:"Mural de ações",doar:"Doar",ongs:"ONGs",chat:"Conversas",minhaong:"Minha ONG",inspecao:"Inspeção",impacto:"Meu impacto",equipe:"Equipe",conta:"Minha conta"};
const SHORT={mural:"Mural",impacto:"Impacto",chat:"Chat",minhaong:"Minha ONG",conta:"Conta"};
const TIPON={doador:"Doador",ong:"Representante de ONG",inspetor:"Inspetor",equipe:"Equipe IFOMME"};
let PERF={},APR={},viewAs=null;
function navFor(){const r=role();return r==="ong"?["mural","minhaong","chat","ongs"]:r==="inspetor"?["inspecao","ongs","mural"]:r==="equipe"?["mural","ongs","chat","inspecao","equipe"]:["mural","doar","ongs","chat","impacto"]}
const CATS=[
 {k:"alimentos",n:"Alimentos",d:"Cestas, não perecíveis, hortifruti",i:"food",u:"kg"},
 {k:"roupas",n:"Roupas e calçados",d:"Agasalhos, infantil, cobertores",i:"shirt",u:"peças"},
 {k:"dinheiro",n:"Dinheiro",d:"PIX direto para a ONG",i:"cash",u:"R$"},
 {k:"voluntariado",n:"Voluntariado",d:"Horas do seu tempo",i:"hands",u:"horas"},
 {k:"material",n:"Material escolar",d:"Cadernos, mochilas, livros",i:"book",u:"kits"},
 {k:"higiene",n:"Higiene e saúde",d:"Fraldas, absorventes, kits",i:"pill",u:"kits"},
 {k:"moveis",n:"Móveis e utensílios",d:"Camas, fogão, panelas",i:"sofa",u:"itens"}
];
const COLORS=["#E5132E","#F06A1D","#3A5BA0","#8A4FA3","#B9741A","#2F7F86","#5E6B2A"];

let ONGS=[],POSTS=[],MINE=[];
const BLANK={id:"",nome:"ONG removida",causa:"",bairro:"",cidade:"",km:0,status:"pendente",nota:0,benef:0,indic:0,aceita:[],needs:[],desc:"",insp:{}};
const byId=id=>ONGS.find(o=>o.id===id)||BLANK;
const hsh=t=>[...String(t)].reduce((a,c)=>a+c.charCodeAt(0),0);
const newId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ago(ts){const m=Math.max(0,Math.round((Date.now()-(ts||0))/6e4));return m<1?"agora":m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:m<2880?"ontem":`há ${Math.round(m/1440)} dias`}

const TIPOS={urgente:["Necessidade urgente","p-crit"],realizada:["Ação realizada","p-ok"],evento:["Evento","p-warn"],agradecimento:["Agradecimento","p-neutral"]};

const ETAPAS=["Doação registrada","ONG confirmou","Coleta / entrega","Recebida","Impacto relatado"];
const CHECKS=[
 {k:"cnpj",t:"CNPJ ativo e compatível com a atividade",d:"Consulta na Receita Federal",w:15},
 {k:"est",t:"Estatuto social e ata da diretoria",d:"Documentos registrados em cartório",w:10},
 {k:"contas",t:"Prestação de contas do último ano",d:"Balanço ou relatório financeiro público",w:20},
 {k:"visita",t:"Visita presencial realizada",d:"Endereço confere e atividade em funcionamento",w:25},
 {k:"fotos",t:"Registro fotográfico do local",d:"Mínimo de 5 fotos com data",w:5},
 {k:"sanit",t:"Condições higiênico-sanitárias para receber alimentos",d:"Armazenamento, refrigeração e manipulação adequados",w:10},
 {k:"ref",t:"Duas referências da comunidade",d:"CRAS, escola, posto de saúde ou liderança local",w:10},
 {k:"benef",t:"Lista de beneficiados confirmada",d:"Pessoas em vulnerabilidade ou risco alimentar, por amostragem e respeitando a LGPD",w:5}
];
let likes=new Set(), follows=new Set();
let db=null,uid=null,ready=false;
let state={view:"mural",filtro:"todos",causa:"todas",soVerif:false,q:"",wiz:{step:1,cat:null,q:"",desc:"",modo:"coleta",cep:"",pick:null},sel:null,msg:"",offline:false};

function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function status(o){return (o.status==="verificado"?'<span class="pill p-ok">✓ Verificada</span>':o.status==="inspecao"?'<span class="pill p-warn">Em inspeção</span>':'<span class="pill p-neutral">Aguardando inspeção</span>')+(o.exemplo?' <span class="pill p-neutral">Exemplo</span>':"")}
function av(o){return `<div class="avatar" style="background:${COLORS[hsh(o.id)%COLORS.length]}">${esc(o.nome.split(" ").filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join(""))}</div>`}
const pct=(a,b)=>Math.min(100,Math.round(a/b*100));

function renderNav(){
  const nav=navFor(),uc=unreadThreads().length,b=(k,l)=>`<button class="nav" type="button" data-go="${k}" ${state.view===k?'aria-current="page"':''}>${svg(k)}<span>${l}</span>${k==="chat"&&uc?`<span class="dot num">${uc}</span>`:""}</button>`;
  $("#navD").innerHTML=[...nav,"conta"].map(k=>b(k,ALLV[k])).join("");
  $("#navM").innerHTML=nav.map(k=>b(k,SHORT[k]||ALLV[k])).join("");
  const n=events().filter(e=>e.ts>SEEN.n).length; $("#bellN").textContent=n; $("#bellN").hidden=!n;
}
function go(v){if(location.hash!=="#"+v)location.hash=v;else route()}
function route(){render();window.scrollTo(0,0)}
function pickView(){const nav=navFor(),h=location.hash.slice(1);state.view=nav.includes(h)||h==="conta"?h:nav[0]}
/* ---------- perfis ---------- */
const myReq=()=>PERF[meKey()]||null;
function okRole(u){const p=PERF[u],a=APR[u];return !!p&&!!a&&a.tipo===p.tipo&&(p.tipo!=="ong"||a.ong===p.ong)}
function role(){if(isAdmin)return viewAs||"equipe";const p=myReq();if(!p||p.tipo==="doador")return "doador";return okRole(meKey())?p.tipo:"doador"}
function pending(){const p=myReq();return !isAdmin&&!!p&&p.tipo!=="doador"&&role()==="doador"}
function myOng(){if(isAdmin)return state.asOng&&byId(state.asOng).id?state.asOng:(ONGS[0]?ONGS[0].id:null);const p=myReq();return p?p.ong:null}
function setPerfil(tipo,ong){const me=meKey(),body={tipo,ong:ong||null,ts:Date.now()},liv=!!db&&!!uid;PERF={...PERF,[me]:body};
 if(liv)W(db.doc("perfis/"+me).set(body));else APR={...APR,[me]:body};
 toast(tipo==="doador"?"Perfil de doador ativado":liv?"Pedido enviado. A equipe IFOMME precisa aprovar seu acesso.":"Perfil ativado nesta visualização");render()}
const choices=()=>`<div class="cats"><button class="cat" data-setrole="doador">${svg("gift")}<b>Quero doar</b><span>Encontrar instituições, doar e acompanhar o impacto</span></button><button class="cat" data-open="rep">${svg("minhaong")}<b>Represento uma ONG</b><span>Publicar ações, pedir doações e atender doadores</span></button><button class="cat" data-setrole="inspetor">${svg("inspecao")}<b>Sou inspetor</b><span>Verificar instituições e conceder o selo</span></button></div>`;
function onb(){if(isAdmin||myReq()||!state.pfReady||state.view==="conta")return "";return `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:20px">Como você vai usar o IFOMME?</h2>${choices()}</div>`}
function formRep(){drawer(`<h2 style="font-size:22px">Represento uma ONG</h2><p class="muted" style="margin:0">Escolha a sua instituição. A equipe IFOMME confirma o vínculo antes de liberar o painel da ONG.</p>
 ${ONGS.length?`<div class="field"><label for="repOng">Instituição</label><select id="repOng">${ONGS.map(o=>`<option value="${o.id}">${esc(o.nome)}</option>`).join("")}</select></div><button class="btn" id="repOk" type="button">Solicitar acesso</button><div class="label">ou</div>`:""}
 <button class="btn ghost" data-open="cadastrar" type="button">Cadastrar uma nova ONG</button>`);
 const b=$("#repOk");b&&b.addEventListener("click",()=>{const v=$("#repOng").value;closeLayer();setPerfil("ong",v)})}
function vConta(){
 if(isAdmin){const cur=viewAs||"equipe";return `<div class="head"><div><h1>Minha conta</h1><p>Você faz parte da equipe IFOMME e pode ver o app como cada perfil.</p></div><span class="pill p-ok">Equipe IFOMME</span></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px"><span class="label">Ver o app como</span><div class="chips">${["equipe","doador","ong","inspetor"].map(k=>`<button class="chip" data-viewas="${k}" aria-pressed="${cur===k}">${TIPON[k]}</button>`).join("")}</div>
  ${cur==="ong"?`<div class="field" style="max-width:340px"><label for="asOng">Instituição</label><select id="asOng">${ONGS.map(o=>`<option value="${o.id}" ${o.id===myOng()?"selected":""}>${esc(o.nome)}</option>`).join("")}</select></div>`:""}</div>`}
 const p=myReq(),t=p?p.tipo:null;
 return `<div class="head"><div><h1>Minha conta</h1><p>${p?"Seu perfil define quais áreas do app você usa.":"Escolha um perfil para começar."}</p></div>${p?(pending()?'<span class="pill p-warn">Aguardando aprovação</span>':'<span class="pill p-ok">Ativo</span>'):""}</div>
 ${p?`<div class="panel"><span class="label">Perfil atual</span><div style="font-family:var(--display);font-weight:800;font-size:20px;margin-top:4px">${TIPON[t]||"Doador"}${t==="ong"&&byId(p.ong).id?" · "+esc(byId(p.ong).nome):""}</div>${pending()?'<p class="muted" style="margin:6px 0 0">Enquanto a equipe analisa o pedido, você usa o app como doador.</p>':""}</div>`:""}
 <div class="panel" style="display:flex;flex-direction:column;gap:12px"><span class="label">${p?"Trocar de perfil":"Perfis"}</span>${choices()}</div>`}
function vEquipe(){
 const reqs=Object.keys(PERF).filter(u=>PERF[u]&&PERF[u].tipo&&PERF[u].tipo!=="doador").sort((a,b)=>(PERF[b].ts||0)-(PERF[a].ts||0)),pend=reqs.filter(u=>!okRole(u)).length;
 return `<div class="head"><div><h1>Equipe</h1><p>Aprove quem pode representar uma instituição ou atuar como inspetor.</p></div></div>
 <div class="stats"><div class="stat"><span class="label">Pedidos pendentes</span><div class="big num">${pend}</div></div><div class="stat"><span class="label">Pessoas com perfil</span><div class="big num">${Object.keys(PERF).length}</div></div><div class="stat"><span class="label">ONGs</span><div class="big num">${ONGS.length}</div></div><div class="stat"><span class="label">Verificadas</span><div class="big num">${ONGS.filter(o=>o.status==="verificado").length}</div></div></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:6px">Pedidos de acesso</h3>${reqs.map(u=>{const q=PERF[u],ok=okRole(u);return `<div class="check" style="align-items:center;flex-wrap:wrap"><div style="min-width:0;flex:1"><b>${esc(pname(u))}</b><div class="muted" style="font-size:13px">${TIPON[q.tipo]||esc(q.tipo)}${q.tipo==="ong"?" · "+esc(byId(q.ong).nome):""}</div></div>${ok?'<span class="pill p-ok">Aprovado</span>':'<span class="pill p-warn">Pendente</span>'}${ok?`<button class="btn sm ghost" data-rev="${esc(u)}">Revogar</button>`:`<button class="btn sm" data-apr="${esc(u)}">Aprovar</button>`}</div>`}).join("")||'<p class="muted" style="margin:6px 0 0">Nenhum pedido ainda. Quando alguém escolher o perfil de ONG ou inspetor, o pedido aparece aqui.</p>'}</div>${donsPanel(null)}${exPanel()}`}
function updNeeds(o,fn){const needs=o.needs.map(x=>({...x}));fn(needs);store.update("ongs",o.id,{needs});render()}
function vMinha(){const o=byId(myOng());if(!o.id)return `<div class="head"><div><h1>Minha ONG</h1><p>Nenhuma instituição vinculada ao seu perfil ainda.</p></div></div>`;
 const sc=inspScore(o.id)||o.nota,conv=threadList("ong").filter(t=>t.ong===o.id).length;
 return `<div class="head"><div><h1>${esc(o.nome)}</h1><p>${esc(o.causa)} · ${esc(o.bairro)}, ${esc(o.cidade)}</p></div><div>${status(o)}</div></div>
 ${o.pendDoc?`<div class="legal"><b>A inspeção pediu documentos</b><span>Envie à equipe IFOMME os documentos que faltam (CNPJ, estatuto, prestação de contas) e combine a visita pelo chat. <button class="lk" type="button" data-docok="${o.id}">Já enviei</button></span></div>`:""}
 <div class="stats"><div class="stat"><span class="label">Inspeção</span><div class="big num">${sc}<span class="muted" style="font-size:15px">/100</span></div></div><div class="stat"><span class="label">Conversas</span><div class="big num">${conv}</div></div><div class="stat"><span class="label">Publicações</span><div class="big num">${POSTS.filter(p=>p.ong===o.id).length}</div></div><div class="stat"><span class="label">Indicações</span><div class="big num">${o.indic||0}</div></div></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:4px">Necessidades</h3><p class="muted" style="margin:0 0 6px;font-size:13px">É o que os doadores veem no mural e na busca. Atualize a quantidade recebida sempre que chegar algo.</p>
 ${o.needs.map((n,i)=>`<div class="need"><div class="t"><b>${esc(n.i)} ${n.urg?'<span class="pill p-crit">urgente</span>':""}</b><span class="muted">${esc((CATS.find(c=>c.k===n.c)||{n:""}).n)}</span></div><div class="bar ${n.urg?"urg":""}"><i style="width:${pct(n.q,n.m)}%"></i></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px"><label for="nq${i}">Recebido</label><input class="inp num" id="nq${i}" type="number" min="0" data-needset="${i}" value="${n.q}" style="width:90px;padding:6px 10px"><span class="muted num">de ${n.m}</span><button class="act" data-needurg="${i}">${n.urg?"Tirar urgência":"Marcar urgente"}</button><button class="act" data-needdel="${i}" style="margin-left:auto">Remover</button></div></div>`).join("")}
 <form id="fNeed" class="form" style="margin-top:14px;align-items:end"><div class="field"><label for="ni">Novo item</label><input class="inp" id="ni" required placeholder="Ex.: Leite em pó"></div><div class="field"><label for="nc">Categoria</label><select id="nc">${CATS.map(c=>`<option value="${c.k}">${c.n}</option>`).join("")}</select></div><div class="field"><label for="nm">Meta</label><input class="inp" id="nm" type="number" min="1" required placeholder="100"></div><button class="btn" type="submit">Adicionar</button></form></div>
 <div class="legal"><b>Ao receber alimentos</b><span>Como intermediária, a instituição só responde por danos se houver dolo, e a responsabilidade dela termina na primeira entrega ao beneficiário final. Os alimentos devem ir, de graça, a pessoas em situação de vulnerabilidade ou risco alimentar. Recuse restos já servidos e produtos vencidos. <button class="lk" type="button" data-open="regras">Ver as regras</button></span></div>
${donsPanel(o.id)}
 <div class="panel" style="display:flex;flex-direction:column;gap:14px"><h3 style="font-size:17px">Dados da instituição</h3>

/* ---------- DOAR (ponte inteligente) ---------- */
function score(o,w){
  let s=0,why=[];const n=o.needs.find(x=>x.c===w.cat);
  if(n){s+=40;why.push("Precisa de "+n.i.toLowerCase());if(n.urg){s+=15;why.push("Urgente")}}
  else if(o.aceita.includes(w.cat)){s+=25;why.push("Aceita essa categoria")}
  else return null;
  if(sameB(o)){s+=25;why.push("No seu bairro")}else if(o.km){s+=Math.max(0,25-o.km*1.6);why.push(o.km.toFixed(1).replace(".",",")+" km")}else{s+=8;why.push(o.bairro)}
  s+=o.status==="verificado"?20:o.status==="inspecao"?8:0;
  if(w.modo==="coleta"&&o.coleta){s+=5;why.push("Faz coleta")}
  return {o,s:Math.min(99,Math.round(s)),why};
}

 return out.sort((a,b)=>a.ts-b.ts)}

  <div class="panel"><h3 style="font-size:17px;margin-bottom:12px">Conquistas</h3><div class="badges">${B.map(b=>`<div class="badge ${b[3]?"got":""}"><i>${b[0]}</i><div><b>${b[1]}</b><div class="muted" style="font-size:12px">${b[2]}</div></div></div>`).join("")}</div></div>`;
}

/* ---------- overlays ---------- */
function drawer(html){$("#layer").innerHTML=`<div class="scrim" data-close><div class="drawer" role="dialog" aria-modal="true">${'<button class="iconbtn x" data-close aria-label="Fechar">✕</button>'}${html}</div></div>`;const f=$("#layer input,#layer button.btn");f&&f.focus()}
function closeLayer(){$("#layer").innerHTML=""}
function perfil(id){const o=byId(id),sc=inspScore(o.id)||o.nota;
 drawer(`<div class="phead">${av(o)}<div class="who"><h2 style="font-size:22px">${esc(o.nome)}</h2><span>${esc(o.causa)} · ${esc(o.bairro)}, ${esc(o.cidade)}</span></div></div><div>${status(o)} ${o.benef?`<span class="pill p-neutral num">${o.benef} beneficiados/mês</span>`:""} <span class="pill p-neutral num">${o.indic||0} indicações</span></div><p style="margin:0">${esc(o.desc)}</p>${o.horario||o.coleta?`<div class="muted" style="font-size:13.5px">${o.horario?"Recebimento: "+esc(o.horario):""}${o.horario&&o.coleta?" · ":""}${o.coleta?"Faz coleta no endereço do doador":""}</div>`:""}
 <div class="gauge"><div class="big num" style="font-size:30px">${sc}</div><div><b>Relatório de inspeção</b><div class="muted" style="font-size:13px">${o.status==="verificado"?"Documentos, visita e referências conferidos.":"Inspeção ainda em andamento. Doe com atenção."}</div></div></div>
 <span class="label">Necessidades</span>${o.needs.map(n=>`<div><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${esc(n.i)}</span><span class="num muted">${n.q}/${n.m}</span></div><div class="bar ${n.urg?"urg":""}" style="margin-top:5px"><i style="width:${pct(n.q,n.m)}%"></i></div></div>`).join("")}
 <span class="label">Aceita</span><div class="chips">${o.aceita.map(a=>`<span class="chip">${CATS.find(c=>c.k===a).n}</span>`).join("")}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-quick="${o.id}|${o.needs[0].c}">Doar para esta ONG</button><button class="btn ghost" data-chat="${o.id}">${svg("chat")}Conversar</button><button class="btn ghost" data-follow="${o.id}">${follows.has(o.id)?"Seguindo":"Seguir"}</button><button class="btn ghost" data-recom="${o.id}" ${myInd.has(o.id)?"disabled":""}>${myInd.has(o.id)?"Recomendada por você":"Recomendar"}</button></div>`)}
function formIndicar(cad){drawer(`<h2 style="font-size:22px">${cad?"Cadastrar minha ONG":"Indicar uma ONG"}</h2><p class="muted" style="margin:0">${cad?"Depois do cadastro, a instituição entra na fila de inspeção da equipe IFOMME.":"Conhece uma instituição séria que precisa de doações? A gente verifica e conecta."}</p>
 <form id="fInd" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label for="fn">Nome da instituição</label><input class="inp" id="fn" required></div>
 <div class="field"><label for="fc">Causa</label><select id="fc">${["Fome","Crianças","Idosos","Mulheres","Pessoas em situação de rua","Animais","Saúde","Educação"].map(c=>`<option>${c}</option>`).join("")}</select></div>
 <div class="field"><label for="fb">Bairro</label><input class="inp" id="fb" required></div>

  if(!cad){myInd.add(id);savePrefs()}

  closeLayer();toast(cad?"Cadastro enviado. Ele já está na fila de inspeção.":"Indicação enviada. Obrigado por ampliar a rede!");state.sel=id;render()})}
function confirmar(id){const o=byId(id),w=state.wiz,c=CATS.find(x=>x.k===w.cat);
 drawer(`<h2 style="font-size:22px">Confirmar doação</h2><div class="panel" style="background:var(--sunk);border:0"><div class="label">Você vai doar</div><b style="font-size:17px">${esc(w.desc||(w.q+" "+c.u+" de "+c.n.toLowerCase()))}</b><div class="label" style="margin-top:12px">Para</div><b>${esc(o.nome)}</b> ${status(o)}<div class="label" style="margin-top:12px">Entrega</div><b>${({coleta:"Coleta em casa",entrega:"Eu levo até a ONG",ponto:"Ponto de coleta"})[w.modo]}</b>${w.cat==="alimentos"?`<div class="label" style="margin-top:12px">Doador e validade</div><b>${esc(w.quem||"Pessoa física")} · ${esc((w.val||"").split("-").reverse().join("/"))}</b>`:""}</div>${w.cat==="alimentos"?TERMO:""}
 ${w.cat==="dinheiro"?(o.pix?`<div class="field"><label for="pix">Chave PIX informada pela instituição</label><div style="display:flex;gap:8px"><input class="inp" id="pix" readonly value="${esc(o.pix)}" style="flex:1;min-width:0"><button class="btn sm ghost" id="cp" type="button">Copiar</button></div><span class="muted" style="font-size:12.5px">Confira o nome do favorecido no seu banco antes de pagar. O IFOMME não processa pagamentos.</span></div>`:`<div class="legal"><b>Chave PIX não cadastrada</b><span>Esta instituição ainda não informou uma chave PIX. Registre a intenção de doar e combine o pagamento pelo chat.</span></div>`):""}
 <p class="muted" style="margin:0;font-size:13px">A instituição confirma cada etapa e você acompanha tudo em Meu impacto.</p><button class="btn" id="ok">Confirmar doação</button>`);
 const cp=$("#cp");cp&&cp.addEventListener("click",()=>{navigator.clipboard.writeText($("#pix").value).then(()=>toast("Chave PIX copiada"),()=>{$("#pix").select();toast("Selecione e copie a chave")})});
 $("#ok").addEventListener("click",()=>{const q=+w.q||1;putMap("doacoes",meKey(),"items",newId(),{...(w.cat==="alimentos"?{quem:w.quem||"Pessoa física",atipo:w.atipo||"indust",val:w.val||null,decl:true,declTs:Date.now()}:{}),kind:"doacao",ong:o.id,cat:w.cat,q,desc:w.desc||(q+" "+c.u+" de "+c.n.toLowerCase()),modo:w.modo,etapa:0,ts:Date.now(),data:new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})});
  state.wiz={step:1,cat:null,q:"",desc:"",modo:"coleta",cep:""};closeLayer();toast("Doação registrada! Acompanhe em Meu impacto.");go("impacto")})}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-f],[data-like],[data-share],[data-rsvp],[data-quick],[data-catgo],[data-cat],[data-chat],[data-thread],[data-step],[data-talk],[data-delpost],[data-purge],[data-recom],[data-docok],[data-ev],[data-setrole],[data-viewas],[data-apr],[data-rev],[data-needurg],[data-needdel],[data-savedesc],[data-cmode],[data-cback],[data-qmsg],[data-modo],[data-wiz],[data-pick],[data-causa],[data-ong],[data-follow],[data-open],[data-sel],[data-approve],[data-pend],[data-adv],[data-close]");

 if(d.go){e.preventDefault();closeLayer();go(d.go)}

 else if(d.rsvp){rsvp.has(d.rsvp)?rsvp.delete(d.rsvp):rsvp.add(d.rsvp);savePrefs();toast(rsvp.has(d.rsvp)?"Presença confirmada":"Presença cancelada");render()}
 else if(d.quick){const[id,c]=d.quick.split("|");state.wiz={step:2,cat:c,q:"",desc:"",modo:"coleta",cep:"",pre:id};closeLayer();go("doar")}
 else if(d.catgo){state.wiz={step:2,cat:d.catgo,q:"",desc:"",modo:"coleta",cep:""};go("doar")}
 else if(d.cat){state.wiz.cat=d.cat;render()}
 else if(d.modo){state.wiz.modo=d.modo;render()}
 else if(d.wiz){saveWiz();if(d.wiz==="next"){if(state.wiz.step===2&&!(+state.wiz.q>0)){toast("Informe a quantidade para continuar");return}if(state.wiz.step===2&&state.wiz.cat==="alimentos"){const w=state.wiz;if(!w.val){toast("Informe a validade dos alimentos");return}if(w.val<hoje()){toast("Alimentos vencidos não podem ser doados");return}if(!(w.decl||[]).every(Boolean)||(w.decl||[]).length<DECL.length){toast("Confirme os quatro itens da declaração para continuar");return}if(w.quem!==state.quem){state.quem=w.quem;savePrefs()}}state.wiz.step++}else state.wiz.step--;render()}
 else if(d.pick)confirmar(d.pick)
 else if(d.causa){state.causa=d.causa;render()}
 else if(d.ong){e.preventDefault();perfil(d.ong)}
 else if(d.follow){const id=d.follow;follows.has(id)?follows.delete(id):follows.add(id);savePrefs();toast(follows.has(id)?"Você vai ver as ações dessa ONG no mural":"Você deixou de seguir");closeLayer();render()}
 else if(d.open)d.open==="rep"?formRep():d.open==="regras"?formRegras():d.open==="local"?formLocal():formIndicar(d.open==="cadastrar")
 else if(d.step){const i=d.step.indexOf("|");stepDon(d.step.slice(0,i),d.step.slice(i+1))}
 else if(d.talk){const i=d.talk.indexOf("|");state.chat={mode:"ong",u:d.talk.slice(0,i),ong:d.talk.slice(i+1)};go("chat")}
 else if(d.delpost){if(state.delPost!==d.delpost){state.delPost=d.delpost;render()}else{state.delPost=null;store.del("posts",d.delpost);toast("Publicação excluída");render()}}
 else if(d.purge){if(!state.purge){state.purge=true;render()}else{state.purge=false;const os=ONGS.filter(o=>o.exemplo).map(o=>o.id),ps=POSTS.filter(p=>p.exemplo).map(p=>p.id);(async()=>{for(const id of ps)await store.del("posts",id);for(const id of os)await store.del("ongs",id);toast("Dados de exemplo apagados");render()})()}}
 else if(d.recom){const o=byId(d.recom);if(o.id&&!myInd.has(o.id)){myInd.add(o.id);savePrefs();store.update("ongs",o.id,{indic:(+o.indic||0)+1});toast("Obrigado! Sua recomendação conta para a fila de inspeção.")}closeLayer();render()}
 else if(d.docok){store.update("ongs",d.docok,{pendDoc:false});toast("Aviso removido");render()}
 else if(d.ev){const ev=(state.evs||[])[+d.ev],pp=$(".pop");pp&&pp.remove();if(ev){if(ev.chat)state.chat={...ev.chat};go(ev.go)}}

 else if(d.rev){if(db){const n={...APR};delete n[d.rev];APR=n;W(db.doc("aprov/"+d.rev).delete());toast("Acesso revogado");render()}}
 else if(d.needurg)updNeeds(byId(myOng()),n=>{n[+d.needurg].urg=!n[+d.needurg].urg})

 document.body.appendChild(p);const rd=$("#rd");rd&&rd.addEventListener("click",()=>{SEEN.n=Date.now();saveSeen();p.remove();renderNav()})});
